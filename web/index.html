<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Desk</title>
<style>
/* Six pages side by side in #pager; each scrolls by itself. Sizes are in vmin so they follow the screen.
   Android 4.4: no CSS variables, grid or object-fit, so themes are body classes and flex needs -webkit- prefixes.
   Never put a CSS filter on a sharp photo here: this WebView draws filtered content at half resolution. */
@font-face{font-family:Hind;font-weight:400;src:url(fonts/Hind-Regular.ttf)}
@font-face{font-family:Hind;font-weight:500;src:url(fonts/Hind-Medium.ttf)}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:rgba(0,0,0,0)}
html,body{height:100%;margin:0;overflow:hidden;-webkit-text-size-adjust:none;font-family:Roboto,"Droid Sans",Helvetica,Arial,sans-serif;background:#0e0f11;color:#eceae4}
svg{display:block;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.row,#hero,#htop,#strip,#hfoot,.tile,#pager,#tiles,#hours,.chips,.todo li,.hrow,#calwrap,#focwrap,.head{display:-webkit-flex;display:flex}
.grow{-webkit-flex:1 1 auto;flex:1 1 auto;min-width:0}
.none{-webkit-flex:0 0 auto;flex:0 0 auto}

#view{position:absolute;top:0;left:0;right:0;bottom:0;overflow:hidden}
#pager{position:absolute;top:0;left:0;bottom:0}
#pager.ease{-webkit-transition:-webkit-transform .28s ease-out;transition:transform .28s ease-out}
.page{position:relative;-webkit-flex:0 0 auto;flex:0 0 auto;overflow:hidden}
.pad{padding:4vmin 4vmin 9vmin}
.mut{color:#9a9a94}
.card{background:#191b1e;border-radius:3vmin;padding:3vmin 3.4vmin;margin-top:2.4vmin}
.head{-webkit-align-items:center;align-items:center;margin-bottom:1.6vmin}
h1{margin:0;font-size:6vmin;font-weight:300}
h2{margin:0;font-size:3.8vmin;font-weight:500}
.btn{display:inline-block;padding:1.5vmin 3.4vmin;border-radius:5vmin;font-size:3.4vmin;font-weight:500;background:#f2b95c;color:#17140c;white-space:nowrap}
.icobtn{width:9vmin;height:9vmin;padding:2.2vmin;border-radius:50%}
.icobtn svg{width:100%;height:100%}

/* ---------- home: first screen is clock + whole photo, and the next section peeks in below */
#hero{-webkit-flex-direction:column;flex-direction:column;padding:3vmin 3vmin 0}
#htop{-webkit-flex:1 1 auto;flex:1 1 auto;min-height:0;-webkit-flex-direction:column;flex-direction:column}
/* one slim row that always fits: no boxes, nothing cut off */
#strip{-webkit-flex:0 0 auto;flex:0 0 auto;-webkit-align-items:center;align-items:center;padding:1.4vmin 1vmin .6vmin;font-size:4vmin}
#hfoot{-webkit-flex:0 0 auto;flex:0 0 auto;min-height:8vmin;-webkit-align-items:center;align-items:center;padding:0 1vmin}
#tiles{-webkit-align-items:center;align-items:center;-webkit-flex-wrap:wrap;flex-wrap:wrap;white-space:nowrap}
.tile{-webkit-align-items:center;align-items:center;margin:.6vmin 3.4vmin .6vmin 0}
.tile svg.moon{fill:currentColor;stroke:none}
.tile svg.moon circle{fill:none;stroke:currentColor;stroke-width:1.2}
.tile svg{width:5vmin;height:5vmin;margin-right:1.2vmin;color:#9a9a94}
.tile .tv{margin-right:1.6vmin}
.tile .tn{font-size:3.4vmin;color:#9a9a94}
#tolink{margin-left:auto;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;padding:1vmin 0 1vmin 3vmin;font-size:3.8vmin;white-space:nowrap}
#tolink svg{width:4.4vmin;height:4.4vmin;margin-left:.8vmin}
#now{-webkit-flex:0 0 auto;flex:0 0 auto;padding:0 1vmin 2vmin}
#hours.card{margin-top:2.4vmin;padding:2vmin 1vmin}
#time{font-size:23vmin;font-weight:200;line-height:.95;letter-spacing:-.02em;white-space:nowrap}
#time small{font-size:36%;margin-left:.15em;letter-spacing:0}
#date{margin-top:1vmin;font-size:4.2vmin;white-space:nowrap}
#wxnow{margin-top:2.4vmin;-webkit-align-items:center;align-items:center}
#wxi svg{width:12vmin;height:12vmin;margin-right:2vmin;stroke-width:1.3;color:#f2b95c}
#wxt{font-size:13vmin;font-weight:200;line-height:1;letter-spacing:-.02em}
#wxd{margin-left:3vmin;font-size:3.8vmin;line-height:1.35;min-width:0}
#wxd b{display:block;font-weight:400}
#wxd span{display:block;font-size:3.2vmin;line-height:1.3}
#refresh{width:8vmin;height:8vmin;margin-left:-1.6vmin;padding:1.8vmin;color:#9a9a94}
#refresh svg{width:4.4vmin;height:4.4vmin}
#refresh.wait{opacity:.35}
#refresh.spin svg{-webkit-animation:spin 1s linear infinite;animation:spin 1s linear infinite}
@-webkit-keyframes spin{to{-webkit-transform:rotate(360deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
#upd{-webkit-flex:1 1 auto;flex:1 1 auto;min-width:0;font-size:2.9vmin;color:#7c7c77;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#upd.warn{color:#e08a5e}
.photo{position:relative;overflow:hidden;background:#000}
.photo div{position:absolute;top:0;left:0;right:0;bottom:0}
.photo .pb{top:-8%;left:-8%;right:-8%;bottom:-8%;background:center/cover no-repeat}
body.liveblur .photo .pb{-webkit-filter:blur(14px) brightness(.62);filter:blur(14px) brightness(.62)}
.photo .pf{background:center/contain no-repeat}
#frame div{top:0;left:0;right:0;bottom:0;border-radius:inherit}
.photo .pd{display:none;background:#000;opacity:.42}
.photo .pold{overflow:hidden;pointer-events:none;-webkit-transform:translateZ(0);transform:translateZ(0)}
.photo .pold.go{opacity:0;-webkit-transition:opacity .8s ease;transition:opacity .8s ease}
body.dimph .photo .pd{display:block}
body.cssgray .photo .pf{-webkit-filter:grayscale(1);filter:grayscale(1)}
body.liveblur.gray .photo .pb{-webkit-filter:grayscale(1) blur(14px) brightness(.62);filter:grayscale(1) blur(14px) brightness(.62)}
#frame{-webkit-flex:1 1 auto;flex:1 1 auto;min-height:0;border-radius:3vmin}
#more{padding:1vmin 4vmin 9vmin}
#tcard{margin-top:0}
#hours{-webkit-justify-content:space-between;justify-content:space-between}
.hr{-webkit-flex:1 1 0;flex:1 1 0;min-width:0;text-align:center;font-size:3.7vmin}
.hr i{display:block;font-style:normal;font-size:2.9vmin;color:#9a9a94}
.hr svg{width:6vmin;height:6vmin;margin:.8vmin auto;stroke-width:1.4;color:#f2b95c}
.dot{display:inline-block;width:2vmin;height:2vmin;margin-right:1.1vmin;border-radius:50%;vertical-align:.25em}
#tcount{margin-left:1.6vmin;font-size:3.4vmin;color:#9a9a94}
.todo{margin:0;padding:0;list-style:none}
.todo li{-webkit-align-items:center;align-items:center;min-height:11vmin;border-top:1px solid #2a2c30;font-size:4.2vmin}
.todo .tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.del{padding:3vmin 1vmin 3vmin 4vmin;color:#77777a}
.del svg{width:3.6vmin;height:3.6vmin}
.box{width:5.4vmin;height:5.4vmin;margin-right:3vmin;padding:.6vmin;border:1.5px solid #77777a;border-radius:50%;color:transparent}
.box svg{width:100%;height:100%;stroke-width:3}
.done .tx{color:#77777a;text-decoration:line-through}
.done .box{background:#f2b95c;border-color:#f2b95c;color:#17140c}
#empty{padding:2vmin 0;font-size:3.6vmin;color:#9a9a94}

/* ---------- photos page */
#pv{position:absolute;top:0;left:0;right:0;bottom:0}
#pvclock{position:absolute;left:3vmin;top:3vmin;font-size:7vmin;font-weight:200;color:#fff;text-shadow:0 0 2vmin rgba(0,0,0,.8)}

/* ---------- this week: today large, then six day cards */
#fplace{margin-left:3vmin;font-size:3.2vmin;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#flist{position:relative}
.fc{position:absolute;margin:0;padding:1vmin;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;text-align:center}
.fc svg{width:9.5vmin;height:9.5vmin;margin:1vmin auto;stroke-width:1.3;color:#f2b95c}
.fd{font-size:3.5vmin}
.ft{font-size:6vmin;font-weight:300;line-height:1.15}
.ft span{margin-left:1.6vmin;font-size:3.8vmin;color:#9a9a94}
.frain{min-height:3.8vmin;font-size:3vmin;color:#7ab6e8}
.fnow{padding:3.4vmin 4vmin;-webkit-align-items:flex-start;align-items:flex-start;text-align:left}
.fnow svg{width:17vmin;height:17vmin;margin:2vmin 0;stroke-width:1.1}
.fnow .fd{font-size:4vmin}
.fnow .ft{font-size:13vmin;font-weight:200;line-height:1}
.fnow .ft span{font-size:6vmin}
.fsub{margin-top:1.6vmin;font-size:3.5vmin}
.fsub2{margin-top:.8vmin;font-size:3.1vmin;color:#9a9a94}

/* ---------- cities */
#clist{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;-webkit-justify-content:space-between;justify-content:space-between}
.city{position:relative;width:100%;margin:0 0 2.4vmin;padding:3vmin 3.4vmin}
.cn{padding-right:7vmin;font-size:4.2vmin;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr{padding-right:7vmin;font-size:3vmin;color:#9a9a94;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;margin-top:1.4vmin}
.cm svg{width:10vmin;height:10vmin;margin-right:2vmin;stroke-width:1.3;color:#f2b95c}
.ct{font-size:11vmin;font-weight:200;line-height:1}
.ci{margin-left:3vmin;min-width:0;font-size:3.2vmin;line-height:1.4;color:#9a9a94}
.ci div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.city .del{position:absolute;top:.6vmin;right:2vmin}
.pr{padding:2.8vmin 1vmin;border-top:1px solid #2a2c30;font-size:3.9vmin;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr span{margin-left:2vmin;font-size:3.2vmin;color:#9a9a94}

/* ---------- calendar */
#calwrap{-webkit-flex-direction:column;flex-direction:column}
#calside{margin-top:2vmin;padding:3vmin}
#calhead{margin-bottom:1vmin;font-size:3.4vmin;font-weight:400;color:#9a9a94}
.ev{padding:1.5vmin 0;border-top:1px solid #2a2c30}
.ev b{display:block;font-weight:400;font-size:3.7vmin;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev span{display:block;margin-top:.4vmin;font-size:3vmin;color:#9a9a94}
.ev.soon span{color:#f2b95c}
#calmain .head{margin-bottom:.6vmin}
#ctitle{text-align:center;font-size:4.2vmin;font-weight:400}
.cw,.cd{-webkit-flex:1 1 0;flex:1 1 0;min-width:0;text-align:center}
.cw{padding-bottom:1vmin;font-size:2.9vmin;color:#9a9a94}
.cd{position:relative;font-size:4.2vmin}
.cd span{display:inline-block;width:9vmin;height:9vmin;line-height:9vmin;border-radius:50%}
.cd.wk{color:#9a9a94}
.cd.hol span{color:#f2b95c;font-weight:500}
.cd.today span,.cd.today.hol span{background:#f2b95c;color:#17140c;font-weight:500}
.cd.out{visibility:hidden}
.cd.has:after{content:"";position:absolute;left:50%;bottom:.6vmin;width:1.2vmin;height:1.2vmin;margin-left:-.6vmin;border-radius:50%;background:#f2b95c}

/* ---------- focus: everything centred, one main action */
#p4{padding-bottom:6vmin;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center}
#focwrap{-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center}
#ringbox{position:relative;width:78vmin;height:78vmin}
#ring{width:100%;height:100%;-webkit-transform:rotate(-90deg);transform:rotate(-90deg);stroke-width:2.2}
#ring .bg{stroke:#25272b}
#ring .fg{stroke:#f2b95c}
#ftime{position:absolute;left:0;right:0;top:50%;margin-top:-11vmin;height:20vmin;line-height:20vmin;text-align:center;font-size:19vmin;font-weight:200;letter-spacing:-.02em}
#fstate{position:absolute;left:0;right:0;top:50%;margin-top:10vmin;text-align:center;font-size:3.4vmin;color:#9a9a94}
#fctl{width:78vmin;margin-top:5vmin;text-align:center}
.chips{-webkit-flex-wrap:wrap;flex-wrap:wrap}
.chip{margin:.8vmin;padding:1.5vmin 3.4vmin;border-radius:5vmin;font-size:3.4vmin;background:#25272b;white-space:nowrap}
.chip.on{background:#f2b95c;color:#17140c;font-weight:500}
.seg{-webkit-flex-wrap:nowrap;flex-wrap:nowrap;padding:.8vmin;background:#191b1e;border-radius:6vmin}
.seg .chip{-webkit-flex:1 1 0;flex:1 1 0;margin:0;padding:2vmin 0;background:transparent;text-align:center}
.seg .chip.on{background:#f2b95c}
#fbtns{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;margin-top:3.6vmin}
#fgo{display:-webkit-flex;display:flex;-webkit-flex:1 1 auto;flex:1 1 auto;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;height:13vmin;border-radius:7vmin;background:#f2b95c;color:#17140c;font-size:4.4vmin;font-weight:500}
#fgo svg{width:5vmin;height:5vmin;margin-right:1.6vmin}
#freset{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;-webkit-flex:0 0 auto;flex:0 0 auto;width:13vmin;height:13vmin;margin-left:2vmin;border-radius:50%;background:#25272b}
#freset svg{width:5vmin;height:5vmin}
#fslide{padding:3.4vmin 3vmin 0}
#islide{padding:1vmin 3vmin 1.6vmin}
#fslide.off{opacity:.35}
.strack{position:relative;height:1.2vmin;margin:2.4vmin 0;border-radius:1vmin;background:#25272b}
.sfill{height:1.2vmin;border-radius:1vmin;background:#f2b95c}
.sthumb{position:absolute;top:50%;width:6vmin;height:6vmin;margin:-3vmin 0 0 -3vmin;border-radius:50%;background:#f2b95c}
.sends{display:-webkit-flex;display:flex;-webkit-justify-content:space-between;justify-content:space-between;font-size:2.9vmin;color:#9a9a94}
#fcount{min-height:4vmin;margin-top:2.6vmin;font-size:3.2vmin;color:#9a9a94}

/* ---------- habits */
.hrow{-webkit-align-items:center;align-items:center;min-height:11vmin;border-top:1px solid #2a2c30}
.hname{font-size:3.9vmin;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:2vmin}
.hstreak{font-size:2.8vmin;color:#9a9a94}
.hc{-webkit-flex:0 0 auto;flex:0 0 auto;width:6.4vmin;height:6.4vmin;margin-left:.9vmin;border-radius:1.5vmin;background:#25272b}
.hc.on{background:#f2b95c}
.hd{-webkit-flex:0 0 auto;flex:0 0 auto;width:6.4vmin;margin-left:.9vmin;text-align:center;font-size:2.6vmin;color:#9a9a94}
.hd.now{color:#f2b95c}

/* ---------- navigation and settings */
#nav{-webkit-transition:opacity .4s;transition:opacity .4s;pointer-events:none}
/* width is explicit (six dots) so the pill can be centred exactly: inline centring lands off-centre on this WebView */
#dots{position:absolute;left:50%;bottom:1.2vmin;height:4.7vmin;padding:1.5vmin 1.2vmin;border-radius:3vmin;background:rgba(14,15,17,.78);font-size:0;white-space:nowrap}
#dots span{display:inline-block;width:1.7vmin;height:1.7vmin;margin:0 .8vmin;border-radius:50%;background:#777;vertical-align:middle}
#dots span.on{background:#f2b95c}
#gear{position:absolute;bottom:.2vmin;width:7vmin;height:7vmin;padding:1.3vmin;border-radius:50%;background:rgba(25,27,30,.82);color:#c8c7c1;-webkit-transition:opacity .4s;transition:opacity .4s}
body.idle #nav,body.idle #gear{opacity:0;pointer-events:none}
#gear svg{width:100%;height:100%}
#pick,#sheet{position:absolute;top:0;left:0;right:0;bottom:0;display:none;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;background:rgba(0,0,0,.55)}
#pick.open,#sheet.open{display:-webkit-flex;display:flex}
/* ---------- countdowns: the next date is the page; the rest stay small */
#cdbig{padding:1vmin 0 2vmin}
#cdnum{font-size:44vmin;line-height:.95}
#cdname{font-size:6vmin;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cdwhen{font-size:3.6vmin;color:#9a9a94}
.cdr{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;min-height:11vmin;border-top:1px solid #2a2c30;font-size:4vmin}
.cdr b{width:17vmin;font-size:6vmin;font-weight:300}
.cdr i{display:block;font-style:normal;font-size:3vmin;color:#9a9a94}

#panel,#pickp{width:88%;max-width:130vmin;max-height:96%;padding:3.4vmin 4vmin;background:#191b1e;border-radius:4vmin}
#pickp{overflow:hidden}
#panel{overflow:hidden}
#panel h2{margin:2.2vmin 0 .8vmin;font-weight:400;font-size:3.4vmin;color:#9a9a94}
#panel .chips{margin:0 -.8vmin}

/* ---------- light theme */
body.t-light{background:#f2f1ec;color:#1b1c1e}
body.t-light .mut,body.t-light .tl,body.t-light .tn,body.t-light #tcount,body.t-light .hr i,body.t-light .flo,body.t-light .cw,body.t-light #fcount,body.t-light .hd,body.t-light .hstreak,body.t-light #empty,body.t-light #panel h2{color:#6d6e6c}
body.t-light .card,body.t-light #panel{background:#fff}
body.t-light .todo li,body.t-light .ev,body.t-light .hrow{border-color:#e6e5df}
body.t-light #ring .bg{stroke:#e6e5df}
body.t-light .hc,body.t-light .chip,body.t-light .fbtn{background:#ebeae4}
body.t-light .btn,body.t-light .chip.on,body.t-light .fbtn.go,body.t-light .cd.today span,body.t-light .done .box{background:#c2410c;border-color:#c2410c;color:#fff}
body.t-light .hc.on,body.t-light #dots span.on,body.t-light .cd.has:after{background:#c2410c}
body.t-light .tile svg,body.t-light .tile .tn,body.t-light .cr,body.t-light .ci,body.t-light .pr span,body.t-light #calhead,body.t-light .ev span,body.t-light .ft span,body.t-light .fsub2{color:#6d6e6c}
body.t-light .fc svg,body.t-light .cm svg,body.t-light .cd.hol span,body.t-light .ev.soon span{color:#c2410c}
body.t-light .cd.today span{color:#fff}
body.t-light .pr{border-color:#e6e5df}
body.t-light #pickp{background:#fff}
body.t-light #fgo{background:#c2410c;color:#fff}
body.t-light #ring .fg{stroke:#c2410c}
body.t-light .seg{background:#fff}
body.t-light .seg .chip{background:transparent}
body.t-light .seg .chip.on{background:#c2410c}
body.t-light .hr svg{color:#c2410c}

body.t-light #freset,body.t-light .strack{background:#ebeae4}
body.t-light .sfill,body.t-light .sthumb{background:#c2410c}
body.t-light .sends,body.t-light #refresh{color:#6d6e6c}
body.t-light #fstate,body.t-light .cd.wk{color:#6d6e6c}
body.t-light #wxi svg,body.t-light .ev i,body.t-light .hd.now{color:#c2410c}
body.t-light #dots{background:rgba(255,255,255,.88)}
body.t-light #gear{background:rgba(255,255,255,.88);color:#44453f}
body.t-light #upd{color:#85867f}
body.t-light .frain{color:#1f6fb2}

/* ---------- e-ink theme: black on white, lines only */
body.t-eink{background:#fff;color:#000}
body.t-eink .mut,body.t-eink .tl,body.t-eink .tn,body.t-eink #tcount,body.t-eink .hr i,body.t-eink .flo,body.t-eink .frain,body.t-eink .cw,body.t-eink #fcount,body.t-eink .hd,body.t-eink .hstreak,body.t-eink #empty,body.t-eink #upd,body.t-eink #panel h2,body.t-eink .del{color:#000}
body.t-eink .card,body.t-eink #panel{background:#fff;border:1.5px solid #000;border-radius:1vmin}
body.t-eink .todo li,body.t-eink .ev,body.t-eink .hrow{border-color:#000}
body.t-eink #time,body.t-eink #wxt,body.t-eink #calnum,body.t-eink #ftime{font-weight:400}
body.t-eink .btn,body.t-eink .chip.on,body.t-eink .fbtn.go,body.t-eink .cd.today span,body.t-eink .done .box{background:#000;border-color:#000;color:#fff;border-radius:1vmin}
body.t-eink .chip,body.t-eink .fbtn{background:#fff;border:1.5px solid #000;border-radius:1vmin}
body.t-eink .box{border-color:#000;border-radius:.6vmin}

  if(v!==F.mins){F.mins=v;F.left=v*60;drawFocus();}
}
function fLeft(){return F.end?Math.max(0,Math.round((F.end-now())/1000)):F.left;}
function drawFocus(){
  var left=fLeft(),tot=F.mins*60;
  if(F.day!==today){F.day=today;F.count=0;}
  $('ftime').textContent=p(Math.floor(left/60))+':'+p(left%60);
  $('rfg').style.strokeDashoffset=339.3*(1-left/tot);
  $('ffill').style.width=$('fthumb').style.left=(F.mins-1)/(FMAX-1)*100+'%';
  $('fslide').className=F.end?'off':'';
  chips($('fmodes'),MODES,F.mins,function(v){F.mins=v;F.left=v*60;F.end=0;fStop();saveF();drawFocus();});
  clear($('fgo'));$('fgo').appendChild(icon(F.end?'pause':'play'));$('fgo').appendChild(document.createTextNode(F.end?'Pause':left<tot?'Resume':'Start'));
  $('fstate').textContent=F.end?(F.mins>5?'Focusing':'On a break'):left<tot?'Paused':'Ready';
  $('fcount').textContent=F.count?F.count+(F.count===1?' session':' sessions')+' today':'';
}
function saveF(){lsSet('dash_focus',F);}
function fStop(){if(fT){clearInterval(fT);fT=null;}}
function fStep(){
  if(F.end&&fLeft()<=0){
    F.end=0;F.left=F.mins*60;fStop();
    if(F.mins>5){F.count++;}
    saveF();
    if(APP&&Android.beep){Android.beep();}
  }
  drawFocus();
}
function fRun(){fStop();fT=setInterval(fStep,1000);}
$('freset').appendChild(icon('reset'));
$('fgo').onclick=function(){if(!tapped()){return;}
  if(F.end){F.left=fLeft();F.end=0;fStop();}else{F.end=now()+F.left*1000;fRun();}
  saveF();drawFocus();};
$('freset').onclick=function(){if(!tapped()){return;}F.end=0;F.left=F.mins*60;fStop();saveF();drawFocus();};

// ---------- countdowns: {list:[{n,date,yearly}]}. A yearly one rolls on to its next date by itself.
var CD=null;
function cdNext(c){
  var t=ymd(new Date()),d=c.date,y;
  if(!c.yearly||d>=t){return d;}
  y=+t.slice(0,4);d=y+d.slice(4);
  return d>=t?d:(y+1)+d.slice(4);
}
function cdDays(d){return Math.round((new Date(d+'T12:00:00')-new Date(ymd(new Date())+'T12:00:00'))/864e5);}
function cdLabel(n){return n===0?'Today':n===1?'Tomorrow':n===-1?'Yesterday':n<0?(-n)+' days ago':n+' days';}
function fmtDate(d){var x=new Date(d+'T12:00:00Z');return DAYS[x.getUTCDay()]+', '+x.getUTCDate()+' '+MON[x.getUTCMonth()]+' '+x.getUTCFullYear();}
function saveCD(){saveState('countdowns','dash_cd',CD);drawCD();}
function cdRemove(c){if(tapped()&&confirm('Remove "'+c.n+'"?')){CD.list.splice(CD.list.indexOf(c),1);saveCD();}}
function drawCD(){
  if(!CD){return;}
  var a=CD.list.slice().sort(function(x,y){
    var dx=cdDays(cdNext(x)),dy=cdDays(cdNext(y));
    return (dx<0)-(dy<0)||dx-dy;}),rest=$('cdrest'),i,top=a[0],n;   // upcoming first, past ones last
  clear(rest);
  $('cdnum').textContent='';$('cdname').textContent='';$('cdwhen').textContent='';
  if(!top){$('cdname').textContent='Add a date to count down to';$('cdwhen').textContent='A trip, a birthday, a deadline.';return;}
  n=cdDays(cdNext(top));
  $('cdnum').textContent=n>1||n<-1?String(Math.abs(n)):n===0?'0':'1';
  $('cdname').textContent=(n===0?'Today: ':n===1?'Day until ':n===-1?'Day since ':n>0?'Days until ':'Days since ')+top.n;
  $('cdwhen').textContent=fmtDate(cdNext(top));
  $('cdnum').onclick=$('cdname').onclick=function(){cdRemove(top);};
  function one(c){
    var r=el('div','cdr'),d=cdNext(c),m=el('div','grow'),x=el('span','del none');
    r.appendChild(el('b','none',String(Math.abs(cdDays(d)))));
    m.appendChild(document.createTextNode(String(c.n)));m.appendChild(el('i','',cdLabel(cdDays(d))+', '+fmtDate(d)));r.appendChild(m);
    x.appendChild(icon('x'));x.onclick=function(){cdRemove(c);};r.appendChild(x);
    rest.appendChild(r);
  }
  for(i=1;i<a.length;i++){one(a[i]);}
}
$('cdadd').onclick=function(){if(!tapped()){return;}
  var t=prompt('What are you counting down to?',''),id;
  if(!t||!(t=t.replace(/^\s+|\s+$/g,''))){return;}
  function got(d){if(d){CD.list.push({n:t,date:d,yearly:confirm('Repeat every year? Choose OK for birthdays and anniversaries.')});saveCD();}}
  if(APP&&Android.pickDate){id=++CBN;CB[id]=got;Android.pickDate('nativeDone',id);}
  else{got(prompt('Date, as YYYY-MM-DD',''));}
};

// ---------- habits: tap a square to tick that day. {list:[{n,days:{"2026-11-06":1}}]}
var H=null;
function habitDays(){var n=window.innerWidth>window.innerHeight?14:7,a=[],i,d;for(i=n-1;i>=0;i--){d=new Date();d.setDate(d.getDate()-i);a.push(d);}return a;}
function streak(h){var n=0,d=new Date();if(!h.days[ymd(d)]){d.setDate(d.getDate()-1);}while(h.days[ymd(d)]){n++;d.setDate(d.getDate()-1);}return n;}
function saveH(){saveState('habits','dash_habits',H);drawHabits();}
function drawHabits(){
  if(!H){return;}
  var box=$('hlist'),ds=habitDays(),i,j,head,sp;
  clear(box);
  if(!H.list.length){box.appendChild(el('div','mut','No habits yet. Tap + Add to start one.'));return;}
  head=el('div','hrow');head.style.borderTop='0';head.style.minHeight='6vmin';head.appendChild(el('div','grow'));
  for(j=0;j<ds.length;j++){head.appendChild(el('div','hd'+(ymd(ds[j])===today?' now':''),DAYS[ds[j].getDay()].charAt(0)));}
  sp=el('span','del none');sp.appendChild(icon('x'));sp.style.visibility='hidden';head.appendChild(sp);
  box.appendChild(head);
  function cell(h,row2,key){
    var c=el('div','hc'+(h.days[key]?' on':''));
    c.onclick=function(){if(!tapped()){return;}if(h.days[key]){delete h.days[key];}else{h.days[key]=1;}saveH();};
    row2.appendChild(c);
  }
  function one(h){
    var r=el('div','hrow'),nm=el('div','grow'),st=streak(h),x=el('span','del none'),k;
    nm.appendChild(el('div','hname',String(h.n)));
    nm.appendChild(el('div','hstreak',st?st+(st===1?' day':' days')+' streak':'Not started'));r.appendChild(nm);
    for(k=0;k<ds.length;k++){cell(h,r,ymd(ds[k]));}
    x.appendChild(icon('x'));
    x.onclick=function(){if(tapped()&&confirm('Delete habit "'+h.n+'"?')){H.list.splice(H.list.indexOf(h),1);saveH();}};
    r.appendChild(x);box.appendChild(r);
  }
  for(i=0;i<H.list.length;i++){one(H.list[i]);}
}
$('hadd').onclick=function(){if(!tapped()){return;}
  var t=prompt('New habit','');
  if(t&&(t=t.replace(/^\s+|\s+$/g,''))){H.list.push({n:t,days:{}});saveH();}};

// ---------- start
WX=lsGet('dash_wx');AQ=lsGet('dash_aq');
H=loadState('habits','dash_habits')||{list:[]};
CD=loadState('countdowns','dash_cd')||{list:[]};
CT=loadState('cities','dash_cities')||{list:(D.cities||[]).slice()};

todo();showPhoto();tiles();showWeather();forecast();drawCal();drawHabits();drawFocus();drawCities();drawCD();sizeHome();tick();
if(saveSettingsSoon){saveSettings();}
if(F.end){fRun();fStep();}
wake();
setInterval(tick,5000);
setTimeout(function(){location.reload();},6*3600000); // fresh start every 6 hours
